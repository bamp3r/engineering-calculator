<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090d14">
    <title>Инженерный калькулятор</title>
    <style>
        /* Базовая палитра и размеры интерфейса */
        :root {
            color-scheme: dark;
            --page: #090d14;
            --surface: #101722;
            --surface-raised: #172130;
            --surface-soft: #1d2938;
            --key: #263447;
            --key-hover: #31435a;
            --muted-key: #1a2533;
            --accent: #3f8cff;
            --accent-hover: #65a3ff;
            --equals: #37d69b;
            --equals-hover: #58e2ae;
            --warning: #d65f70;
            --warning-hover: #e97a8a;
            --text: #f7f9fc;
            --text-muted: #a9b6c8;
            --text-faint: #7f8da2;
            --line: rgba(255, 255, 255, 0.08);
            --gap: clamp(0.25rem, 1.2vw, 0.55rem);
            --radius: 0.875rem;
            --shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.38);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-width: 20rem;
            min-height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
            background:
                radial-gradient(circle at 50% 0%, rgba(63, 140, 255, 0.13), transparent 38rem),
                var(--page);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-variant-numeric: tabular-nums;
            display: grid;
            place-items: center;
        }

        button {
            min-width: 2.75rem;
            min-height: 2.75rem;
            margin: 0;
            padding: 0.35rem 0.3rem;
            border: 0.0625rem solid transparent;
            border-radius: var(--radius);
            background: var(--key);
            color: var(--text);
            box-shadow:
                inset 0 0.0625rem 0 rgba(255, 255, 255, 0.06),
                0 0.25rem 0.7rem rgba(0, 0, 0, 0.18);
            font: inherit;
            font-size: clamp(0.9rem, 3vw, 1.05rem);
            font-weight: 650;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 100ms ease, background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
        }

        button:hover {
            background: var(--key-hover);
        }

        button:active {
            transform: scale(0.96);
            box-shadow: inset 0 0.125rem 0.35rem rgba(0, 0, 0, 0.28);
        }

        button:focus-visible {
            outline: 0.1875rem solid #b9d4ff;
            outline-offset: 0.125rem;
            position: relative;
            z-index: 2;
        }

        #calculator {
            position: relative;
            width: min(100%, 26.25rem);
            height: 100%;
            max-height: 100dvh;
            padding: clamp(0.5rem, 2.2vw, 1rem);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: clamp(0.3rem, 1.4vh, 0.75rem);
            background: linear-gradient(160deg, rgba(23, 33, 48, 0.98), rgba(12, 18, 27, 0.98));
            border: 0.0625rem solid var(--line);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        #display {
            min-width: 0;
            padding: clamp(0.5rem, 2vw, 0.9rem);
            border: 0.0625rem solid var(--line);
            border-radius: calc(var(--radius) + 0.25rem);
            background: rgba(5, 9, 15, 0.62);
            box-shadow: inset 0 0.0625rem 0.8rem rgba(0, 0, 0, 0.28);
        }

        #indicators {
            min-height: 1.75rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .status-group {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .indicator {
            min-height: 1.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 999rem;
            display: inline-flex;
            align-items: center;
            background: rgba(63, 140, 255, 0.14);
            color: #b9d4ff;
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.08em;
        }

        #mem {
            background: rgba(55, 214, 155, 0.13);
            color: #8ef0ca;
        }

        #historyToggle {
            min-width: 2.75rem;
            min-height: 2.75rem;
            padding: 0;
            border-color: var(--line);
            background: var(--surface-soft);
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        #historyToggle:hover {
            background: var(--key-hover);
            color: var(--text);
        }

        #expr {
            min-height: 1.25rem;
            overflow-x: auto;
            overflow-y: hidden;
            color: var(--text-muted);
            font-size: clamp(0.75rem, 2.5vw, 0.92rem);
            line-height: 1.35;
            text-align: right;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        #result {
            min-width: 0;
            min-height: 1.12em;
            overflow-x: auto;
            overflow-y: hidden;
            color: var(--text);
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 650;
            line-height: 1.05;
            letter-spacing: -0.04em;
            text-align: right;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        .keypad {
            min-height: 0;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: var(--gap);
        }

        .key-group {
            min-width: 0;
        }

        .group-label {
            margin: 0 0 0.35rem 0.15rem;
            color: var(--text-faint);
            font-size: 0.68rem;
            font-weight: 750;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            gap: var(--gap);
        }

        .grid-memory,
        .grid-science,
        .grid-main {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .grid-memory button {
            background: #151e2a;
            border-color: var(--line);
            color: var(--text-muted);
            font-size: clamp(0.74rem, 2.7vw, 0.9rem);
        }

        .grid-memory button:hover {
            background: #202d3d;
            color: var(--text);
        }

        .grid-science button {
            background: var(--muted-key);
            border-color: rgba(255, 255, 255, 0.035);
            color: #c8d2df;
            font-size: clamp(0.68rem, 2.65vw, 0.88rem);
            font-weight: 600;
        }

        .grid-science button:hover {
            background: #263649;
            color: var(--text);
        }

        .primary-stack {
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: var(--gap);
        }

        .grid-controls {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid-controls button {
            background: rgba(214, 95, 112, 0.18);
            border-color: rgba(233, 122, 138, 0.22);
            color: #ffb7c1;
        }

        .grid-controls button:hover {
            background: var(--warning-hover);
            color: #16070a;
        }

        .grid-main button {
            font-size: clamp(1rem, 4.6vw, 1.35rem);
        }

        .grid-main button[data-role="num"] {
            background: var(--key);
        }

        .grid-main button[data-role="op"] {
            background: rgba(63, 140, 255, 0.22);
            border-color: rgba(101, 163, 255, 0.2);
            color: #c6dcff;
        }

        .grid-main button[data-role="op"]:hover {
            background: var(--accent-hover);
            color: #061325;
        }

        .grid-main button[data-value="="] {
            background: var(--equals);
            color: #05271b;
            box-shadow: 0 0.4rem 1.1rem rgba(55, 214, 155, 0.22);
        }

        .grid-main button[data-value="="]:hover {
            background: var(--equals-hover);
        }

        #historyPanel {
            position: fixed;
            z-index: 20;
            left: env(safe-area-inset-left);
            right: env(safe-area-inset-right);
            bottom: env(safe-area-inset-bottom);
            height: 50dvh;
            padding: 1rem;
            overflow-y: auto;
            border: 0.0625rem solid var(--line);
            border-bottom: 0;
            border-radius: 1.25rem 1.25rem 0 0;
            background: rgba(16, 23, 34, 0.98);
            box-shadow: 0 -1rem 3rem rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(1rem);
        }

        #historyPanel::before {
            content: "История";
            display: block;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        #historyPanel button {
            width: 100%;
            min-height: 3rem;
            margin-bottom: 0.5rem;
            padding: 0.55rem 0.75rem;
            background: var(--surface-soft);
            color: var(--text);
            font-size: 1rem;
            line-height: 1.35;
            text-align: right;
        }

        /* Телефоны: интерфейс занимает экран без прокрутки страницы */
        @media (max-width: 30rem) {
            :root {
                --gap: clamp(0.125rem, 0.6vw, 0.25rem);
            }

            #calculator {
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }

            #display {
                padding: 0.3rem 0.5rem;
            }

            #indicators {
                min-height: 1.5rem;
                margin-bottom: 0.1rem;
            }

            #historyToggle,
            button {
                min-height: 2.75rem;
            }

            .group-label {
                position: absolute;
                width: 0.0625rem;
                height: 0.0625rem;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }

            .grid-science,
            .grid-memory,
            .grid-main,
            .grid-controls {
                grid-auto-rows: minmax(2.75rem, 1fr);
            }
        }

        /* Планшеты: научные функции и цифровой блок стоят рядом */
        @media (min-width: 30.0625rem) {
            #calculator {
                width: min(calc(100% - 2rem), 45rem);
                height: auto;
                max-height: calc(100dvh - 2rem);
                border-radius: 1.5rem;
            }

            .keypad {
                grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
                grid-template-rows: auto minmax(0, 1fr);
            }

            .memory-group {
                grid-column: 1 / -1;
            }

            .science-group,
            .primary-stack {
                align-self: stretch;
            }

            .grid-science,
            .grid-main {
                height: calc(100% - 1.25rem);
                grid-auto-rows: minmax(3rem, 1fr);
            }

            .grid-controls {
                grid-auto-rows: minmax(3rem, auto);
            }
        }

        /* Десктоп: история раскрывается справа от калькулятора */
        @media (min-width: 56.3125rem) {
            #calculator {
                overflow: visible;
            }

            #historyPanel {
                position: absolute;
                inset: 0 auto 0 calc(100% + 1rem);
                width: min(20rem, calc((100vw - 45rem) / 2 - 2rem));
                height: auto;
                border: 0.0625rem solid var(--line);
                border-radius: 1.25rem;
                box-shadow: var(--shadow);
            }
        }

        /* В альбомной ориентации сохраняем двухколоночную раскладку */
        @media (orientation: landscape) and (max-height: 40rem) {
            #calculator {
                width: min(calc(100% - 1rem), 45rem);
                max-height: calc(100dvh - 1rem);
                padding: 0.5rem;
            }

            #display {
                padding-block: 0.35rem;
            }

            .keypad {
                grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
                grid-template-rows: auto minmax(0, 1fr);
            }

            .memory-group {
                grid-column: 1 / -1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main id="calculator" aria-label="Инженерный калькулятор">
        <section id="display" aria-live="polite">
            <div id="indicators">
                <div class="status-group">
                    <span id="mode" class="indicator">DEG</span>
                    <span id="mem" class="indicator">M</span>
                </div>
                <button id="historyToggle" type="button" aria-label="Показать или скрыть историю">H</button>
            </div>
            <div id="expr">&nbsp;</div>
            <div id="result">0</div>
        </section>

        <div class="keypad">
            <section class="key-group memory-group" aria-labelledby="memory-label">
                <h2 class="group-label" id="memory-label">Память</h2>
                <div class="grid grid-memory">
                    <button data-value="MC" data-role="eng">MC</button>
                    <button data-value="MR" data-role="eng">MR</button>
                    <button data-value="M+" data-role="eng">M+</button>
                    <button data-value="M-" data-role="eng">M−</button>
                </div>
            </section>

            <section class="key-group science-group" aria-labelledby="science-label">
                <h2 class="group-label" id="science-label">Научные функции</h2>
                <div class="grid grid-science">
                    <button data-value="sin(" data-role="eng">sin</button>
                    <button data-value="cos(" data-role="eng">cos</button>
                    <button data-value="tan(" data-role="eng">tan</button>
                    <button data-value="DEG" data-role="eng">DEG/RAD</button>
                    <button data-value="asin(" data-role="eng">asin</button>
                    <button data-value="acos(" data-role="eng">acos</button>
                    <button data-value="atan(" data-role="eng">atan</button>
                    <button data-value="sqrt(" data-role="eng">√</button>
                    <button data-value="ln(" data-role="eng">ln</button>
                    <button data-value="log(" data-role="eng">log</button>
                    <button data-value="log2(" data-role="eng">log₂</button>
                    <button data-value="abs(" data-role="eng">|x|</button>
                    <button data-value="^2" data-role="eng">x²</button>
                    <button data-value="^3" data-role="eng">x³</button>
                    <button data-value="pow(" data-role="eng">xʸ</button>
                    <button data-value="1/(" data-role="eng">1/x</button>
                    <button data-value="exp(" data-role="eng">eˣ</button>
                    <button data-value="pow(10," data-role="eng">10ˣ</button>
                    <button data-value="!" data-role="eng">n!</button>
                    <button data-value="pi" data-role="eng">π</button>
                    <button data-value="e" data-role="eng">e</button>
                    <button data-value="(" data-role="special">(</button>
                    <button data-value=")" data-role="special">)</button>
                    <button data-value="%" data-role="special">%</button>
                    <button data-value="±" data-role="special">±</button>
                    <button data-value="CE" data-role="special">CE</button>
                </div>
            </section>

            <section class="primary-stack" aria-label="Основные клавиши">
                <div class="grid grid-controls">
                    <button data-value="C" data-role="special">C</button>
                    <button data-value="DEL" data-role="special">⌫</button>
                </div>
                <div class="grid grid-main">
                    <button data-value="7" data-role="num">7</button>
                    <button data-value="8" data-role="num">8</button>
                    <button data-value="9" data-role="num">9</button>
                    <button data-value="/" data-role="op">÷</button>
                    <button data-value="4" data-role="num">4</button>
                    <button data-value="5" data-role="num">5</button>
                    <button data-value="6" data-role="num">6</button>
                    <button data-value="*" data-role="op">×</button>
                    <button data-value="1" data-role="num">1</button>
                    <button data-value="2" data-role="num">2</button>
                    <button data-value="3" data-role="num">3</button>
                    <button data-value="-" data-role="op">−</button>
                    <button data-value="0" data-role="num">0</button>
                    <button data-value="." data-role="num">.</button>
                    <button data-value="=" data-role="special">=</button>
                    <button data-value="+" data-role="op">+</button>
                </div>
            </section>
        </div>

        <aside id="historyPanel" style="display:none;" aria-label="История вычислений"></aside>
    </main>

<script>
function evaluate(expression, mode) {
    // Токенизатор
    const tokenize = (input) => {
        const tokens = [];
        let i = 0;
        while (i < input.length) {
            const c = input[i];
            
            // Пробелы
            if (c.match(/\s/)) {
                i++;
                continue;
            }
            
            // Числа
            if (c.match(/\d/)) {
                let num = '';
                while (i < input.length && (input[i].match(/\d/) || input[i] === '.')) {
                    num += input[i++];
                }
                tokens.push({ type: 'number', value: parseFloat(num) });
                continue;
            }
            
            // Переменные и функции
            if (c.match(/[a-zA-Z]/)) {
                let func = '';
                while (i < input.length && input[i].match(/[a-zA-Z0-9]/)) {
                    func += input[i++];
                }
                
                if (['pi', 'e'].includes(func)) {
                    tokens.push({ type: 'constant', value: func });
                } else if (['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sqrt', 'log', 'ln', 'log2', 'abs', 'exp'].includes(func)) {
                    tokens.push({ type: 'function', value: func });
                } else {
                    throw new Error(`Неизвестная функция или переменная: ${func}`);
                }
                continue;
            }
            
            // Операторы
            if (c === '+') {
                tokens.push({ type: 'operator', value: '+' });
                i++;
            } else if (c === '-') {
                tokens.push({ type: 'operator', value: '-' });
                i++;
            } else if (c === '*') {
                tokens.push({ type: 'operator', value: '*' });
                i++;
            } else if (c === '/') {
                tokens.push({ type: 'operator', value: '/' });
                i++;
            } else if (c === '^') {
                tokens.push({ type: 'operator', value: '^' });
                i++;
            } else if (c === '(') {
                tokens.push({ type: 'paren', value: '(' });
                i++;
            } else if (c === ')') {
                tokens.push({ type: 'paren', value: ')' });
                i++;
            } else if (c === '!') {
                tokens.push({ type: 'operator', value: '!' });
                i++;
            } else {
                throw new Error(`Неверный символ: ${c}`);
            }
        }
        return tokens;
    };

    // Парсер
    const parse = (tokens) => {
        const output = [];
        const operators = [];
        
        const precedence = {
            '+': 1,
            '-': 1,
            '*': 2,
            '/': 2,
            '^': 3,
            '!': 4,
            'neg': 2
        };
        
        let lastToken = null;
        for (const token of tokens) {
            if (token.type === 'number') {
                output.push(token);
            } else if (token.type === 'constant') {
                if (token.value === 'pi') {
                    output.push({ type: 'number', value: Math.PI });
                } else if (token.value === 'e') {
                    output.push({ type: 'number', value: Math.E });
                }
            } else if (token.type === 'function') {
                operators.push({ type: 'function', value: token.value });
            } else if (token.type === 'operator') {
                // Handle unary minus
                if (token.value === '-' && (
                    lastToken === null ||
                    (lastToken.type === 'operator' && lastToken.value !== ')') || (lastToken.type === 'function') || (lastToken.type === 'paren' && lastToken.value === ')') ||
                    (lastToken.type === 'paren' && lastToken.value === '(')
                )) {
                    operators.push({ type: 'operator', value: 'neg' });
                } else if (token.value === '!') {
                    // Обработка факториала
                    const operand = output.pop();
                    if (!operand) {
                        throw new Error('Ошибка: недостаточно операндов для факториала');
                    }
                    if (operand.value < 0 || operand.value > 170) {
                        throw new Error('Ошибка: факториал должен быть 0 ≤ n ≤ 170');
                    }
                    output.push({ type: 'number', value: factorial(operand.value) });
                } else {
                    // Обработка других операторов
                    while (
                        operators.length > 0 &&
                        operators[operators.length - 1].type === 'operator' &&
                        (
                            precedence[operators[operators.length - 1].value] > precedence[token.value] ||
                            (precedence[operators[operators.length - 1].value] === precedence[token.value] && operators[operators.length - 1].value !== '^' && token.value !== '^')
                        )
                    ) {
                        const op = operators.pop();
                        if (op.value === 'neg') {
                            const operand = output.pop();
                            if (!operand) {
                                throw new Error('Ошибка: недостаточно операндов для отрицательного');
                            }
                            output.push({ type: 'number', value: applyOperator(undefined, operand.value, op.value) });
                        } else {
                            const right = output.pop();
                            const left = output.pop();
                            output.push({ type: 'number', value: applyOperator(left.value, right.value, op.value) });
                        }
                    }
                    operators.push(token);
                }
            } else if (token.type === 'paren') {
                if (token.value === '(') {
                    operators.push({ type: 'paren', value: '(' });
                } else {
                    // Завершение скобки
                    while (operators.length > 0 && operators[operators.length - 1].type !== 'paren') {
                        const op = operators.pop();
                        if (op.value === 'neg') {
                            const operand = output.pop();
                            if (!operand) {
                                throw new Error('Ошибка: недостаточно операндов для отрицательного');
                            }
                            output.push({ type: 'number', value: applyOperator(undefined, operand.value, op.value) });
                        } else {
                            const right = output.pop();
                            const left = output.pop();
                            output.push({ type: 'number', value: applyOperator(left.value, right.value, op.value) });
                        }
                    }
                    if (operators.length === 0) {
                        throw new Error('Ошибка: несоответствие скобок');
                    }
                    operators.pop(); // Удалить '(' из стека
                    // Apply function if next on stack
                    if (operators.length > 0 && operators[operators.length - 1].type === 'function') {
                        const func = operators.pop();
                        const arg = output.pop();
                        output.push({ type: 'number', value: applyOperator(undefined, arg.value, func.value) });
                    }
                }
            }
            lastToken = token;
        }
        
        // Очистка оставшихся операторов
        // console.log('final operators', operators);
        // console.log('final output', output);
        while (operators.length > 0) {
            const op = operators.pop();
            if (op.type === 'function') {
                const arg = output.pop();
                output.push({ type: 'number', value: applyOperator(undefined, arg.value, op.value) });
            } else {
                if (op.value === 'neg') {
                    const operand = output.pop();
                    if (!operand) {
                        throw new Error('Ошибка: недостаточно операндов для отрицательного');
                    }
                    output.push({ type: 'number', value: applyOperator(undefined, operand.value, op.value) });
                } else {
                    const right = output.pop();
                    const left = output.pop();
                    // console.log('applying binary op', op.value, 'left', left, 'right', right);
                    output.push({ type: 'number', value: applyOperator(left.value, right.value, op.value) });
                }
            }
        }
        
        if (output.length !== 1) {
            throw new Error('Ошибка: недостаточно операндов');
        }
        
        return output[0].value;
    };

    const factorial = (n) => {
        if (n === 0) return 1;
        let result = 1;
        for (let i = 1; i <= n; i++) {
            result *= i;
        }
        return result;
    };

    const applyOperator = (left, right, operator) => {
        switch (operator) {
            case '+':
                return left + right;
            case '-':
                return left - right;
            case '*':
                return left * right;
            case '/':
                if (right === 0) {
                    throw new Error('Ошибка: деление на ноль');
                }
                return left / right;
            case '^':
                return Math.pow(left, right);
            case 'sin':
                return Math.sin(right);
            case 'cos':
                return Math.cos(right);
            case 'tan':
                return Math.tan(right);
            case 'asin':
                if (right < -1 || right > 1) {
                    throw new Error('Ошибка: аргумент arcsin должен быть в диапазоне [-1, 1]');
                }
                return Math.asin(right);
            case 'acos':
                if (right < -1 || right > 1) {
                    throw new Error('Ошибка: аргумент arccos должен быть в диапазоне [-1, 1]');
                }
                return Math.acos(right);
            case 'atan':
                return Math.atan(right);
            case 'sqrt':
                if (right < 0) {
                    throw new Error('Ошибка: квадратный корень из отрицательного числа');
                }
                return Math.sqrt(right);
            case 'ln':
                if (right <= 0) {
                    throw new Error('Ошибка: логарифм от неположительного числа');
                }
                return Math.log(right);
            case 'log':
                if (right <= 0) {
                    throw new Error('Ошибка: логарифм от неположительного числа');
                }
                return Math.log10(right);
            case 'log2':
                if (right <= 0) {
                    throw new Error('Ошибка: логарифм от неположительного числа');
                }
                return Math.log2(right);
            case 'abs':
                return Math.abs(right);
            case 'neg':
                return -right;
            default:
                throw new Error(`Ошибка: неизвестный оператор ${operator}`);
        }
    };

    // Обработка режима (DEG/RAD) для тригонометрических функций
    let originalFunctions = null;
    if (mode === 'DEG') {
        originalFunctions = {
            sin: Math.sin,
            cos: Math.cos,
            tan: Math.tan,
            asin: Math.asin,
            acos: Math.acos,
            atan: Math.atan
        };
        Math.sin = (x) => originalFunctions.sin(x * Math.PI / 180);
        Math.cos = (x) => originalFunctions.cos(x * Math.PI / 180);
        Math.tan = (x) => originalFunctions.tan(x * Math.PI / 180);
        Math.asin = (x) => originalFunctions.asin(x) * 180 / Math.PI;
        Math.acos = (x) => originalFunctions.acos(x) * 180 / Math.PI;
        Math.atan = (x) => originalFunctions.atan(x) * 180 / Math.PI;
    }

    // Выполнение парсинга и вычисления
    const tokens = tokenize(expression);
    let result;
    try {
        result = parse(tokens);
    } finally {
        if (originalFunctions) {
            Math.sin = originalFunctions.sin;
            Math.cos = originalFunctions.cos;
            Math.tan = originalFunctions.tan;
            Math.asin = originalFunctions.asin;
            Math.acos = originalFunctions.acos;
            Math.atan = originalFunctions.atan;
        }
    }
    return result;
}

if (typeof module !== 'undefined') {
    module.exports = { evaluate };
}
// Обработчики кнопок
if (typeof document !== 'undefined') {
    let expr = '';
    let mode = 'DEG';
    let memory = 0;
    const history = [];
    const memEl = document.getElementById('mem');
    const historyToggle = document.getElementById('historyToggle');
    const historyPanel = document.getElementById('historyPanel');
    const updateMemIndicator = () => {
        memEl.style.display = memory !== 0 ? 'inline' : 'none';
    };
    updateMemIndicator();
    historyToggle.addEventListener('click', () => {
        historyPanel.style.display = historyPanel.style.display === 'none' ? 'block' : 'none';
    });
    const refreshHistory = () => {
        historyPanel.innerHTML = '';
        history.slice().reverse().forEach((item) => {
            const btn = document.createElement('button');
            btn.textContent = item;
            btn.style.display = 'block';
            btn.style.width = '100%';
            btn.style.textAlign = 'left';
            btn.style.background = 'transparent';
            btn.style.border = 'none';
            btn.style.color = 'inherit';
            btn.style.padding = '2px 0';
            btn.addEventListener('click', () => {
                expr = item.toString();
                exprEl.textContent = expr || ' ';
                resultEl.textContent = item;
            });
            historyPanel.appendChild(btn);
        });
    };

    const exprEl = document.getElementById('expr');
    const resultEl = document.getElementById('result');
    const modeEl = document.getElementById('mode');
    const buttons = document.querySelectorAll('button[data-value]');
    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            const val = btn.dataset.value;
            switch (val) {
                case 'C':
                    expr = '';
                    resultEl.textContent = '0';
                    break;
                case 'CE':
                    expr = '';
                    break;
                case 'DEL':
                    expr = expr.slice(0, -1);
                    break;
                case '±':
                    // Переворачиваем знак последнего числа
                    expr = expr.replace(/([0-9.]+)$/, (m) => {
                        if (m[0] === '-') return m.slice(1);
                        return '-' + m;
                    });
                    break;
                case '%':
                    // Делим последнюю цифру на 100
                    expr = expr.replace(/([0-9.]+)$/, (m) => '(' + m + '/100)');
                    break;
                case 'DEG':
                    mode = mode === 'DEG' ? 'RAD' : 'DEG';
                    modeEl.textContent = mode;
                    break;
                case 'MC':
                    memory = 0;
                    updateMemIndicator();
                    break;
                case 'MR':
                    expr += memory.toString();
                    break;
                case 'M+':
                    try {
                        const current = parseFloat(resultEl.textContent);
                        memory += current;
                        updateMemIndicator();
                    } catch {}
                    break;
                case 'M-':
                    try {
                        const current = parseFloat(resultEl.textContent);
                        memory -= current;
                        updateMemIndicator();
                    } catch {}
                    break;
                case '=':
                    try {
                        const res = evaluate(expr, mode);
                        resultEl.textContent = res;
                        history.push(res);
                        if (history.length > 10) history.shift();
                        refreshHistory();
                    } catch (e) {
                        console.error(e); resultEl.textContent = 'Error';
                    }
                    break;
                default:
                    expr += val;
                    break;
            }
            exprEl.textContent = expr || ' ';
        });
    });
    // Keyboard support
    if (typeof window !== 'undefined') {
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            const numeric = /[0-9]/;
            const operators = ['+', '-', '*', '/', '^', '%', '(', ')', '.'];
            if (numeric.test(key)) {
                expr += key;
                exprEl.textContent = expr || ' ';
            } else if (operators.includes(key)) {
                expr += key;
                exprEl.textContent = expr || ' ';
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                try {
                    const res = evaluate(expr, mode);
                    resultEl.textContent = res;
                    history.push(res);
                    if (history.length > 10) history.shift();
                    refreshHistory();
                } catch (e) {
                    console.error(e); resultEl.textContent = 'Error';
                }
            } else if (key === 'Backspace') {
                expr = expr.slice(0, -1);
                exprEl.textContent = expr || ' ';
            } else if (key === 'Escape') {
                expr = '';
                resultEl.textContent = '0';
                exprEl.textContent = ' ';
            }
        });
    }

}

        // Export for Node.js tests
        if (typeof module !== 'undefined') {
            module.exports = { evaluate };
        }
